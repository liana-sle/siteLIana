<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Контакты Лианы Слепухи — модели. Связаться для съёмок, показов и сотрудничества.">
<meta name="author" content="Лиана Слепуха">
<title>Контакты — Лиана Слепуха</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f7f3ee;
    --beige:#e8ded1;
    --pudra:#d8b4a0;
    --brown:#4a3b32;
    --gold:#b08d57;
    --text:#3d332c;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Montserrat',sans-serif;
    background:var(--cream);
    color:var(--text);
    line-height:1.7;
    font-weight:300;
  }
  h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:400;color:var(--brown);}

  /* ---------- Шапка ---------- */
  header{
    background:linear-gradient(rgba(74,59,50,.6),rgba(74,59,50,.6)),
               url('https://images.unsplash.com/photo-1483985988355-763728e1935b?w=1600') center/cover no-repeat;
    height:55vh;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    text-align:center;color:#fff;padding:20px;
  }
  header h1{font-size:clamp(2.2rem,6vw,4rem);color:#fff;letter-spacing:2px;font-weight:300;}
  header p{font-size:1rem;letter-spacing:4px;text-transform:uppercase;margin-top:15px;color:var(--beige);}
  header .line{width:80px;height:1px;background:var(--pudra);margin:25px auto;}

  /* ---------- Навигация ---------- */
  nav{
    position:sticky;top:0;z-index:10;
    background:rgba(247,243,238,.95);
    backdrop-filter:blur(6px);
    display:flex;justify-content:center;gap:35px;
    padding:18px;border-bottom:1px solid var(--beige);
  }
  nav a{
    text-decoration:none;color:var(--brown);
    font-size:.85rem;letter-spacing:2px;text-transform:uppercase;
    transition:.3s;
  }
  nav a:hover{color:var(--gold);}

  /* ---------- Секции ---------- */
  section{max-width:900px;margin:0 auto;padding:80px 25px;}
  section h2{font-size:2.4rem;margin-bottom:15px;text-align:center;}
  section h2::after{content:"";display:block;width:60px;height:1px;background:var(--gold);margin:18px auto 0;}
  .subtitle{text-align:center;font-style:italic;font-family:'Cormorant Garamond',serif;
            font-size:1.2rem;color:var(--gold);margin-bottom:45px;}

  /* ---------- Контакты ---------- */
  .contact-list{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;margin-bottom:50px;
  }
  .contact-item{
    background:#fff;padding:30px 25px;border-radius:6px;
    box-shadow:0 8px 30px rgba(74,59,50,.07);
    text-align:center;transition:.3s;
  }
  .contact-item:hover{transform:translateY(-4px);box-shadow:0 15px 40px rgba(74,59,50,.12);}
  .contact-item h3{font-size:1.3rem;margin-bottom:10px;}
  .contact-item a{color:var(--gold);text-decoration:none;word-break:break-word;}
  .contact-item a:hover{text-decoration:underline;}

  /* ---------- Форма ---------- */
  .form-box{
    background:#fff;padding:40px 35px;border-radius:6px;
    box-shadow:0 8px 30px rgba(74,59,50,.07);
  }
  .form-box p.form-title{
    text-align:center;text-transform:uppercase;letter-spacing:2px;
    font-size:.8rem;margin-bottom:30px;color:var(--brown);
  }
  .form-group{margin-bottom:20px;}
  .form-group label{
    display:block;margin-bottom:8px;font-size:.8rem;
    letter-spacing:1.5px;text-transform:uppercase;color:var(--brown);
  }
  .form-group input,
  .form-group textarea{
    width:100%;padding:14px 16px;
    background:var(--cream);border:1px solid var(--beige);
    border-radius:3px;font-family:'Montserrat',sans-serif;
    font-size:.95rem;color:var(--text);
    transition:.3s;
  }
  .form-group input:focus,
  .form-group textarea:focus{
    outline:none;border-color:var(--gold);background:#fff;
  }
  .form-group textarea{resize:vertical;min-height:130px;}

  .btn{
    font-family:'Montserrat',sans-serif;cursor:pointer;
    background:transparent;border:1px solid var(--gold);color:var(--brown);
    padding:14px 40px;font-size:.8rem;letter-spacing:2px;
    text-transform:uppercase;transition:.35s;border-radius:2px;
    display:block;margin:0 auto;
  }
  .btn:hover{background:var(--gold);color:#fff;}

  /* ---------- Футер ---------- */
  footer{background:var(--brown);color:var(--beige);text-align:center;padding:50px 20px;margin-top:60px;}
  footer a{color:var(--pudra);text-decoration:none;}
  footer a:hover{text-decoration:underline;}
  footer .social{margin:20px 0;font-size:.9rem;letter-spacing:1px;}

  @media(max-width:600px){
    header{height:45vh;}
    .form-box{padding:30px 20px;}
  }
</style>
</head>
<body>

<!-- ======= ШАПКА ======= -->
<header>
  <h1>Контакты</h1>
  <div class="line"></div>
  <p>Лиана Слепуха · Модель</p>
</header>

<!-- ======= НАВИГАЦИЯ ======= -->
<nav>
  <a href="index.html">Главная</a>
  <a href="page2.html">Портфолио</a>
  <a href="#contact">Связаться</a>
</nav>

<!-- ======= КОНТАКТЫ ======= -->
<section id="contact">
  <h2>Связаться со мной</h2>
  <p class="subtitle">Открыта к съёмкам, показам и творческим проектам</p>

  <div class="contact-list">
    <div class="contact-item">
      <h3>Email</h3>
      <a href="mailto:slepukhalr@mail.ru">slepukhalr@mail.ru</a>
    </div>

  </div>

  <!-- Форма -->
  <div class="form-box">
    <p class="form-title">Оставить заявку</p>
    <form action="#" method="post">
      <div class="form-group">
        <label for="name">Ваше имя</label>
        <input type="text" id="name" name="name" placeholder="Как к вам обращаться?" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="message">Сообщение</label>
        <textarea id="message" name="message" placeholder="Расскажите о проекте..." required></textarea>
      </div>
      <button type="submit" class="btn">Отправить</button>
    </form>
  </div>
</section>

<!-- ======= ФУТЕР ======= -->
<footer>
  <h2 style="color:var(--beige);">Лиана Слепуха</h2>
  <p class="social">
    <a href="mailto:slepukhalr@mail.ru">Email</a>
  </p>
  <p style="font-size:.8rem;opacity:.7;">© 2026 Лиана Слепуха · Все права защищены</p>
</footer>

</body>
</html>
